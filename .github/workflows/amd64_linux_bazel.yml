# ref: https://github.com/actions/runner-images
name: amd64 Linux Bazel

# Controls when the action will run.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Each run on master gets its own group, so that master runs are never
  # cancelled and every commit gets a CI result. Setting
  # cancel-in-progress to false would not suffice: a new run still cancels
  # a pending run in the same group.
  group: ${{github.workflow}}-${{github.ref == 'refs/heads/master' && github.run_id || github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    name: ${{matrix.runner}}•${{matrix.cc}}•Bzl${{matrix.bazel}}•C++${{matrix.cpp}}•Py${{matrix.python}}
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        # A sparse matrix, as described in
        # https://opensource.google/documentation/policies/cplusplus-support:
        # every supported Bazel, C++ and Python version, and the oldest and
        # newest default compilers of the supported Ubuntu LTS releases, are
        # tested in at least one job, rather than all combinations.
        include:
          # Oldest supported Ubuntu LTS: GCC 11, Clang 14.
          - {runner: ubuntu-22.04, cc: gcc, bazel: 8.x, cpp: 17, python: '3.10'}
          - {runner: ubuntu-22.04, cc: clang-14, bazel: 9.x, cpp: 17, python: '3.11'}
          # GCC 13.
          - {runner: ubuntu-24.04, cc: gcc, bazel: 9.x, cpp: 17, python: '3.12'}
          - {runner: ubuntu-24.04, cc: gcc, bazel: 8.x, cpp: 20, python: '3.13'}
          # Newest Ubuntu LTS: GCC 15, Clang 22.
          - {runner: ubuntu-26.04, cc: gcc, bazel: 9.x, cpp: 20, python: '3.14'}
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 8.x, cpp: 20, python: '3.15'}
    env:
      # Bazel's C++ toolchain autoconfiguration uses $CC.
      CC: ${{matrix.cc}}
      USE_BAZEL_VERSION: ${{matrix.bazel}}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # One disk cache per configuration: a cache is written once per key,
          # and the configurations' compile actions mostly differ (Bazel 8 jobs
          # get almost no hits from Bazel 9 results), so a shared cache mainly
          # helps the configuration that saved it.
          disk-cache: ${{github.workflow}}-${{matrix.runner}}-${{matrix.cc}}-bzl${{matrix.bazel}}-cxx${{matrix.cpp}}-py${{matrix.python}}
          repository-cache: true
          # Only master saves caches; pull requests restore master's caches
          # (by key prefix), so they pay only for what they change, and the
          # repository's 10 GB cache storage is not filled with per-PR copies.
          cache-save: ${{github.ref == 'refs/heads/master'}}
          # Bazel 9 also keeps extracted repositories (e.g. Python toolchains)
          # in the repository cache, which grew the saved cache from about
          # 0.4 GB to 1.6 GB; restoring that takes longer than re-extracting.
          bazelrc: common --repo_contents_cache=
      - name: Check Bazel
        run: bazel version
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python}}
      - name: Check Python
        run: |
          python --version
          python -m platform
      - name: Build
        run: >
          bazel build
          --config=ci
          --@rules_python//python/config_settings:python_version=${{matrix.python}}
          --cxxopt=-std=c++${{matrix.cpp}} --host_cxxopt=-std=c++${{matrix.cpp}}
          --subcommands=pretty_print
          //...
      - name: Test
        run: >
          bazel test
          --config=ci
          --@rules_python//python/config_settings:python_version=${{matrix.python}}
          --cxxopt=-std=c++${{matrix.cpp}} --host_cxxopt=-std=c++${{matrix.cpp}}
          --subcommands=pretty_print
          //...

  amd64_linux_bazel:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v7
