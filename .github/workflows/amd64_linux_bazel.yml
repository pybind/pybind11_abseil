# ref: https://github.com/actions/runner-images
name: amd64 Linux Bazel

# Controls when the action will run.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Each run on master gets its own group, so that master runs are never
  # cancelled and every commit gets a CI result. Setting
  # cancel-in-progress to false would not suffice: a new run still cancels
  # a pending run in the same group.
  group: ${{github.workflow}}-${{github.ref == 'refs/heads/master' && github.run_id || github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    name: ${{matrix.runner}}•${{matrix.cc}}•Bzl${{matrix.bazel}}(${{matrix.mode}})•C++${{matrix.cpp}}•Py${{matrix.python}}
    runs-on: ${{matrix.runner}}
    strategy:
      fail-fast: false
      matrix:
        # A sparse matrix, as described in
        # https://opensource.google/documentation/policies/cplusplus-support:
        # start from one origin configuration and vary one dimension at a time
        # across the supported Ubuntu LTS releases and their compilers, Bazel
        # versions, compilation modes, C++ standards, and Python versions.
        #
        # Other workflows vary the build system (amd64_linux_cmake.yml, plus
        # arm64_macos_cmake.yml and amd64_windows_cmake.yml for platform- and
        # multi-config-specific CMake logic) and operating system /
        # architecture (arm64_macos_bazel.yml and amd64_windows_bazel.yml).
        include:
          # Origin: newest Ubuntu LTS, newest Clang, Bazel 9, fastbuild, C++17,
          # default Python.
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.12'}
          # Compiler and Ubuntu LTS variations (GCC 15, GCC 13, GCC 11, Clang 14).
          - {runner: ubuntu-26.04, cc: gcc, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.12'}
          - {runner: ubuntu-24.04, cc: gcc, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.12'}
          - {runner: ubuntu-22.04, cc: gcc, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.12'}
          - {runner: ubuntu-22.04, cc: clang-14, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.12'}
          # Bazel version variation.
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 8.x, mode: fastbuild, cpp: 17, python: '3.12'}
          # Compilation mode variation.
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 9.x, mode: dbg, cpp: 17, python: '3.12'}
          # C++ standard variation.
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 9.x, mode: fastbuild, cpp: 20, python: '3.12'}
          # Python version variations.
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.10'}
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.11'}
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.13'}
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.14'}
          - {runner: ubuntu-26.04, cc: clang-22, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.15'}
    env:
      # Bazel's C++ toolchain autoconfiguration uses $CC.
      CC: ${{matrix.cc}}
      USE_BAZEL_VERSION: ${{matrix.bazel}}
    steps:
      - uses: actions/checkout@v7
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # One disk cache per configuration: a cache is written once per key,
          # so a shared cache mainly helps the configuration that saved it.
          disk-cache: ${{github.workflow}}-${{matrix.runner}}-${{matrix.cc}}-bzl${{matrix.bazel}}-${{matrix.mode}}-cxx${{matrix.cpp}}-py${{matrix.python}}
          repository-cache: true
          # Only master saves caches; pull requests restore master's caches
          # (by key prefix), so they pay only for what they change, and the
          # repository's 10 GB cache storage is not filled with per-PR copies.
          cache-save: ${{github.ref == 'refs/heads/master'}}
          # Bazel 9 also keeps extracted repositories (e.g. Python toolchains)
          # in the repository cache, which grew the saved cache from about
          # 0.4 GB to 1.6 GB; restoring that takes longer than re-extracting.
          bazelrc: common --repo_contents_cache=
      - name: Check Bazel
        run: bazel version
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python}}
      - name: Check Python
        run: |
          python --version
          python -m platform
      - name: Build
        run: >
          bazel build
          --config=ci
          -c ${{matrix.mode}}
          --@rules_python//python/config_settings:python_version=${{matrix.python}}
          --cxxopt=-std=c++${{matrix.cpp}} --host_cxxopt=-std=c++${{matrix.cpp}}
          --subcommands=pretty_print
          //...
      - name: Test
        run: >
          bazel test
          --config=ci
          -c ${{matrix.mode}}
          --@rules_python//python/config_settings:python_version=${{matrix.python}}
          --cxxopt=-std=c++${{matrix.cpp}} --host_cxxopt=-std=c++${{matrix.cpp}}
          --subcommands=pretty_print
          //...

  amd64_linux_bazel:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v7
