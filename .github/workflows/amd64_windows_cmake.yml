# ref: https://github.com/actions/runner-images
name: amd64 Windows CMake

# Controls when the action will run.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Each run on master gets its own group, so that master runs are never
  # cancelled and every commit gets a CI result. Setting
  # cancel-in-progress to false would not suffice: a new run still cancels
  # a pending run in the same group.
  group: ${{github.workflow}}-${{github.ref == 'refs/heads/master' && github.run_id || github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    strategy:
      matrix:
        # Kept in addition to amd64_windows_bazel.yml and amd64_linux_cmake.yml
        # because our CMake build has Windows- and multi-config-specific logic
        # that neither of those workflows exercises:
        # * cmake/dependencies/CMakeLists.txt sets BUILD_SHARED_LIBS=ON,
        #   building abseil_dll.dll (whereas Bazel on Windows links Abseil
        #   statically), and pybind11_abseil_build_tree_module in CMakeLists.txt
        #   has a WIN32-only POST_BUILD command copying
        #   $<TARGET_RUNTIME_DLLS:...> next to each .pyd so Python 3.8+ can load
        #   them.
        # * Visual Studio is a multi-config generator, testing that
        #   LIBRARY_OUTPUT_DIRECTORY "$<1:${CMAKE_CURRENT_BINARY_DIR}>"
        #   suppresses the per-config Release/ subdirectory so CTest can import
        #   extension modules from PYTHONPATH=${CMAKE_BINARY_DIR}.
        include:
          - {runner: windows-latest, generator: Visual Studio 18 2026, config: Release, build_target: ALL_BUILD, test_target: RUN_TESTS, install_target: INSTALL, cpp: 17, python: '3.12'}
      fail-fast: false
    name: ${{matrix.runner}}•CMake(${{matrix.generator}},${{matrix.config}})•C++${{matrix.cpp}}•Py${{matrix.python}}
    runs-on: ${{matrix.runner}}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python}}
      - name: Check Python
        run: |
          python --version
          python -m platform
      - name: Install Python requirements
        run: python -m pip install --upgrade -r $(python -c 'import sys; print("./pybind11_abseil/requirements/requirements_lock_%d_%d.txt" % (sys.version_info[:2]))')
      - name: Check CMake
        run: |
          cmake --version
          cmake -G || true
      - name: Configure
        run: >
          cmake -S. -Bbuild
          -G "${{matrix.generator}}"
          -DCMAKE_CONFIGURATION_TYPES=${{matrix.config}}
          -DCMAKE_CXX_STANDARD=${{matrix.cpp}}
          -DCMAKE_INSTALL_PREFIX=install
      - name: Build
        run: >
          cmake --build build
          --config ${{matrix.config}}
          --target ${{matrix.build_target}}
          -v -j2
      - name: Test
        shell: bash
        run: >
          CTEST_OUTPUT_ON_FAILURE=1
          cmake --build build
          --config ${{matrix.config}}
          --target ${{matrix.test_target}}
          -v
      - name: Install
        run: >
          cmake --build build
          --config ${{matrix.config}}
          --target ${{matrix.install_target}}
          -v

  amd64_windows_cmake:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v7
