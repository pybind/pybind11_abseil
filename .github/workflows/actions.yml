# ref: https://github.com/actions/runner-images
name: build_and_test

# Controls when the action will run.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Each run on master gets its own group, so that master runs are never
  # cancelled and every commit gets a CI result. Setting
  # cancel-in-progress to false would not suffice: a new run still cancels
  # a pending run in the same group.
  group: ${{github.workflow}}-${{github.ref == 'refs/heads/master' && github.run_id || github.ref}}
  cancel-in-progress: true

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-latest]
        build_tool: [bazel, cmake]

    name: "script ${{matrix.build_tool}}"
    runs-on: ${{matrix.runs-on}}

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: Show env
        run: env
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v7

      - name: Setup bazel
        if: matrix.build_tool == 'bazel'
        uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Show bazel version
        if: matrix.build_tool == 'bazel'
        run: bazel --version

      - name: Show cmake version
        if: matrix.build_tool == 'cmake'
        run: cmake --version

      # The runner's system Python is managed by Debian (pip cannot replace its
      # packages) and may be newer than the versions with requirements lock
      # files, so use a Python from actions/setup-python instead.
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Show platform info
        run: python -m platform

      - name: Install virtualenv
        run: python -m pip install virtualenv

      - name: Show nproc
        run: echo nproc=$(nproc)

      - name: Build and run tests
        run: bash ./scripts/build_and_run_tests_${{matrix.build_tool}}.sh -j $(nproc)
