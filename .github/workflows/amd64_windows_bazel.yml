# ref: https://github.com/actions/runner-images
name: amd64 Windows Bazel

# Controls when the action will run.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Each run on master gets its own group, so that master runs are never
  # cancelled and every commit gets a CI result. Setting
  # cancel-in-progress to false would not suffice: a new run still cancels
  # a pending run in the same group.
  group: ${{github.workflow}}-${{github.ref == 'refs/heads/master' && github.run_id || github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    strategy:
      matrix:
        runner: [
          windows-2022,
          #windows-2019,
        ]
        bazel: [
          {compilation_mode: opt},
          {compilation_mode: dbg},
        ]
        cpp: [
          {version: 17, flags: "/std:c++17"},
          #{version: 20, flags: "/std:c++20"},
        ]
        python: [
          {version: '3.11'},
        ]
        exclude:
          - runner: windows-2019
            cpp: {version: 20}
          # only test -c dbg with VS 2022 version 17 to save compute time
          - runner: windows-2019
            bazel: {compilation_mode: dbg}
          - cpp: {version: 20}
            bazel: {compilation_mode: dbg}
      fail-fast: false # Don't cancel all jobs if one fails.
    name: ${{ matrix.runner }}•Bazel(${{ matrix.bazel.compilation_mode }})•C++${{ matrix.cpp.version }}•Python${{ matrix.python.version }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.version }}
      - name: Check Python
        run: |
          python --version
          python -m platform
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          # One disk cache per configuration: a cache is written once per key,
          # and the configurations do not share compile actions.
          disk-cache: ${{github.workflow}}-${{matrix.runner}}-${{matrix.bazel.compilation_mode}}-cxx${{matrix.cpp.version}}-py${{matrix.python.version}}
          repository-cache: true
          # Only master saves caches; pull requests restore master's caches
          # (by key prefix), so they pay only for what they change, and the
          # repository's 10 GB cache storage is not filled with per-PR copies.
          cache-save: ${{github.ref == 'refs/heads/master'}}
      - name: Install Bazel
        run: choco install bazel
      - name: Check Bazel
        run: bazel version
      - name: Build
        run: >
          bazel build
          --config=ci
          -c ${{ matrix.bazel.compilation_mode }}
          --@rules_python//python/config_settings:python_version=${{ matrix.python.version }}
          --cxxopt=${{ matrix.cpp.flags }} --host_cxxopt=${{ matrix.cpp.flags }}
          --subcommands=pretty_print
          --enable_bzlmod
          //...
      - name: Test
        run: >
          bazel test
          --config=ci
          -c ${{ matrix.bazel.compilation_mode }}
          --@rules_python//python/config_settings:python_version=${{ matrix.python.version }}
          --cxxopt=${{ matrix.cpp.flags }} --host_cxxopt=${{ matrix.cpp.flags }}
          --subcommands=pretty_print
          --enable_bzlmod
          //...

  amd64_windows_bazel:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v7
