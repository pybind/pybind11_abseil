# ref: https://github.com/actions/runner-images
name: arm64 MacOS Bazel

# Controls when the action will run.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Each run on master gets its own group, so that master runs are never
  # cancelled and every commit gets a CI result. Setting
  # cancel-in-progress to false would not suffice: a new run still cancels
  # a pending run in the same group.
  group: ${{github.workflow}}-${{github.ref == 'refs/heads/master' && github.run_id || github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    strategy:
      matrix:
        # Varies the operating system (macOS) and architecture (arm64) from the
        # origin in amd64_linux_bazel.yml, keeping Bazel 9, fastbuild, C++17,
        # and Python 3.12 fixed. Compiler, C++ standard, and Python version
        # variations are tested on Linux; keeping macOS Bazel to a single job
        # also stays well below GitHub Actions' 5-concurrent-macOS-runner cap.
        include:
          - {runner: macos-latest, bazel: 9.x, mode: fastbuild, cpp: 17, python: '3.12'}
      fail-fast: false
    name: ${{matrix.runner}}•Bazel(${{matrix.mode}})•C++${{matrix.cpp}}•Py${{matrix.python}}
    runs-on: ${{matrix.runner}}
    env:
      USE_BAZEL_VERSION: ${{matrix.bazel}}
    steps:
      - uses: actions/checkout@v7
      - name: Set Java to OpenJDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{matrix.python}}
      - name: Check Python
        run: |
          python --version
          python -m platform
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{github.workflow}}-${{matrix.mode}}-cxx${{matrix.cpp}}-py${{matrix.python}}
          repository-cache: true
          # Only master saves caches; pull requests restore master's caches
          # (by key prefix), so they pay only for what they change, and the
          # repository's 10 GB cache storage is not filled with per-PR copies.
          cache-save: ${{github.ref == 'refs/heads/master'}}
          # Bazel 9 also keeps extracted repositories (e.g. Python toolchains)
          # in the repository cache, which grew the saved cache from about
          # 0.4 GB to 1.6 GB; restoring that takes longer than re-extracting.
          bazelrc: common --repo_contents_cache=
      - name: Check Bazel
        run: bazel version
      - name: Build
        run: >
          bazel build
          --config=ci
          -c ${{matrix.mode}}
          --@rules_python//python/config_settings:python_version=${{matrix.python}}
          --cxxopt=-std=c++${{matrix.cpp}} --host_cxxopt=-std=c++${{matrix.cpp}}
          --subcommands=pretty_print
          --enable_bzlmod
          //...
      - name: Test
        run: >
          bazel test
          --config=ci
          -c ${{matrix.mode}}
          --@rules_python//python/config_settings:python_version=${{matrix.python}}
          --cxxopt=-std=c++${{matrix.cpp}} --host_cxxopt=-std=c++${{matrix.cpp}}
          --subcommands=pretty_print
          --enable_bzlmod
          //...

  arm64_macos_bazel:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v7
