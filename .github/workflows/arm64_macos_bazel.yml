# ref: https://github.com/actions/runner-images
name: arm64 MacOS Bazel

# Controls when the action will run.
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  # Each run on master gets its own group, so that master runs are never
  # cancelled and every commit gets a CI result. Setting
  # cancel-in-progress to false would not suffice: a new run still cancels
  # a pending run in the same group.
  group: ${{github.workflow}}-${{github.ref == 'refs/heads/master' && github.run_id || github.ref}}
  cancel-in-progress: true

# Building using the github runner environement directly.
jobs:
  native:
    strategy:
      matrix:
        bazel: [
          {compilation_mode: opt},
          {compilation_mode: dbg},
        ]
        cpp: [
          {version: 17, flags: "-std=c++17"},
          #{version: 20, flags: "-std=c++20"},
        ]
        python: [
          {version: '3.11'},
        ]
        exclude:
          # only test `-c dbg` build with C++17
          - cpp: {version: 20}
            bazel: {compilation_mode: dbg}
      fail-fast: false
    name: MacOS•Bazel(${{ matrix.bazel.compilation_mode }})•C++${{ matrix.cpp.version }}•Python${{ matrix.python.version }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Java to OpenJDK 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python.version }}
      - name: Check Python
        run: |
          python --version
          python -m platform
      - name: Check Bazel
        run: bazel version
      - name: Build
        run: >
          bazel build
          --config=ci
          -c ${{ matrix.bazel.compilation_mode }}
          --@rules_python//python/config_settings:python_version=${{ matrix.python.version }}
          --cxxopt=${{ matrix.cpp.flags }} --host_cxxopt=${{ matrix.cpp.flags }}
          --subcommands=pretty_print
          --enable_bzlmod
          //...
      - name: Test
        run: >
          bazel test
          --config=ci
          -c ${{ matrix.bazel.compilation_mode }}
          --@rules_python//python/config_settings:python_version=${{ matrix.python.version }}
          --cxxopt=${{ matrix.cpp.flags }} --host_cxxopt=${{ matrix.cpp.flags }}
          --subcommands=pretty_print
          --enable_bzlmod
          //...

  arm64_macos_bazel:
    runs-on: ubuntu-latest
    needs: native
    steps:
      - uses: actions/checkout@v7
